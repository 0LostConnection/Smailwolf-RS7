[workspace]
resolver = "2"
members = [
    "crates/rs7-core",
    "crates/rs7-tui",
    "crates/rs7-gui",
]
# makepkg clones into packaging/aur/*/src — keep that tree out of this workspace
exclude = ["packaging"]
default-members = ["crates/rs7-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rs7-core = { path = "crates/rs7-core", version = "0.1.0" }
crossterm = "0.29.0"
hidapi = "2.6.6"
ratatui = "0.30.2"
thiserror = "2.0.18"
pretty_assertions = "1.4.1"
gpui-kit = "0.9.0"
anyhow = "1"
