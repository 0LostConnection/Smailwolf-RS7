[package]
name = "rs7-tui"
version = "0.1.0"
edition = "2024"
description = "TUI configurator for Smailwolf RS7 gaming mouse (YJX HID protocol)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
crossterm = "0.29.0"
hidapi = "2.6.6"
ratatui = "0.30.2"
